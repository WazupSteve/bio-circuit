[project]
name = "biocircuit"
version = "0.1.0"
description = "Prime RL environment for circuit-level interpretability of Qwen3-4B attribution graphs"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "modal>=1.5.1",
    "prime>=0.6.20",
    "verifiers>=0.3.1,<0.4",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.15",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ty.src]
include = ["environments/circuit_supernodes/circuit_supernodes"]

[tool.pytest.ini_options]
testpaths = ["environments/circuit_supernodes/tests"]
pythonpath = ["environments/circuit_supernodes"]
