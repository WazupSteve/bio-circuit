# prime eval run configs/eval/suppressed-features.toml [--hosted]
model = "Qwen/Qwen3.5-4B"
num_tasks = 16
num_rollouts = 1
max_turns = 16

[sampling]
max_tokens = 16384
enable_thinking = false

[taskset]
id = "suppressed-features"
dataset_file = "suppressed-features.jsonl"
discovery_threshold = 0.8
heldout_threshold = 0.3
max_view_features = 4096
reward_mode = "eval"

[harness]
id = "null"
