# From environments/circuit_supernodes: uv run eval @ ../../configs/eval/supernode-rediscovery.toml --no-push
model = "Qwen/Qwen3.5-4B"
num_tasks = 16
num_rollouts = 1
max_concurrent = 8

[sampling]
max_tokens = 16384

[env.taskset]
id = "supernode-rediscovery"
dataset_file = "promptless-supernodes.jsonl.gz"
min_cohort_success = 0.6
max_control_activation = 0.0

[env.taskset.subject]
model_name = "Qwen/Qwen3-4B"
transcoder_set = "mwhanna/qwen3-4b-transcoders"
node_threshold = 0.8
edge_threshold = 0.98

[env.agent]
max_turns = 16

[env.agent.harness]
id = "circuit-null"
tool_timeout = 3600
