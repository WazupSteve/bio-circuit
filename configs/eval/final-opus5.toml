# Frontier baseline under reward v2.1, on the full held-out split.
# Run from environments/circuit_supernodes with PRIME_API_KEY exported:
#   uv run eval @ ../../configs/eval/final-opus5.toml --no-push
#
# All three final configs use the same 20 tasks so the comparison is paired;
# only the model differs. Two rollouts give a per-task variance estimate without
# doubling spend — the audit showed graph-to-graph variation dominates, and
# pairing handles that.
model = "anthropic/claude-opus-5"
num_tasks = 20
num_rollouts = 2
max_turns = 8

[sampling]
max_tokens = 32768  # xhigh reasoning; 16k risks truncating a rollout into a zero
reasoning_effort = "xhigh"

[taskset]
id = "circuit-supernodes"
dataset_file = "heldout.jsonl"
reward_mode = "eval"
max_features = 150  # the audit's recommendation: at 60 a policy can partition
# everything into 5x12 and measure the whole scored matrix in 5 of its 7
# experiments. Above 96 that stops being possible, and the policy-reachable
# blind strategy loses 39% of its separation while a real proposal loses none.

[harness]
id = "null"

[client]
base_url = "https://api.pinference.ai/api/v1"
api_key_var = "PRIME_API_KEY"
