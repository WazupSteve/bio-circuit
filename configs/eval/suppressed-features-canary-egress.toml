model = "openai/gpt-4.1-mini"
num_tasks = 1
num_rollouts = 1

[sampling]
max_tokens = 4096

[env.taskset]
id = "suppressed-features"
dataset_file = "suppressed-features.jsonl.gz"

[env.taskset.subject]
model_name = "Qwen/Qwen3-4B"
transcoder_set = "mwhanna/qwen3-4b-transcoders"
node_threshold = 0.8
edge_threshold = 0.98

[env.agent]
max_turns = 8

[env.agent.harness]
id = "circuit-null"
tool_timeout = 3600
