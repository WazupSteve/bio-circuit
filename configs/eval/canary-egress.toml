# Stage 1.1 — hard blocker, ~$1.
#
#   prime eval run configs/eval/canary-egress.toml --hosted --follow
#
# The whole reward calls out to a Modal GPU service from inside the environment.
# Prime's docs cover secret injection into hosted runs but say nothing about
# outbound network access from environment code, so this is the one assumption
# that can invalidate the architecture. One task, one rollout, cheapest model:
# if `reward_components` comes back populated, egress and secrets both work.
#
# Requires MODAL_TOKEN_ID / MODAL_TOKEN_SECRET as environment secrets linked to
# the pushed environment (docs: tutorials-environments/secrets).
model = "openai/gpt-4.1-mini"
num_tasks = 1
num_rollouts = 1
max_turns = 4

[sampling]
max_tokens = 4096

[taskset]
id = "circuit-supernodes"
dataset_file = "heldout.jsonl"
reward_mode = "eval"

[harness]
id = "null"
