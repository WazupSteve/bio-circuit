# prime train run configs/rl/circuit-mdl.toml
model = "Qwen/Qwen3.5-4B"
max_steps = 40
batch_size = 128
rollouts_per_example = 8

[sampling]
max_tokens = 16384
enable_thinking = false

[[pre_batch_filters]]
type = "zero_advantage"
enforce = true

[[post_batch_filters]]
type = "repetition"
enforce = false

[[env]]
max_turns = 8

[env.taskset]
id = "circuit-supernodes"
dataset_file = "train-mdl.jsonl"
reward_mode = "train"

[env.harness]
id = "null"

[eval]
interval = 10
num_examples = 16
rollouts_per_example = 1
eval_base_model = true

[[eval.env]]
max_turns = 8

[eval.env.taskset]
id = "circuit-supernodes"
dataset_file = "heldout-mdl.jsonl"
reward_mode = "eval"

[eval.env.harness]
id = "null"
