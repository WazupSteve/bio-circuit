# prime train run configs/rl/suppressed-features.toml
model = "Qwen/Qwen3.5-4B"
max_steps = 40
batch_size = 128
rollouts_per_example = 8

[sampling]
max_tokens = 16384
enable_thinking = false

[[pre_batch_filters]]
type = "zero_advantage"
enforce = true

[[post_batch_filters]]
type = "repetition"
enforce = false

[[env]]
max_turns = 16

[env.taskset]
id = "suppressed-features"
dataset_file = "suppressed-features-train.jsonl"
discovery_threshold = 0.8
heldout_threshold = 0.3
max_view_features = 4096
reward_mode = "train"

[env.harness]
id = "null"

[eval]
interval = 10
num_examples = 16
rollouts_per_example = 1
eval_base_model = true

[[eval.env]]
max_turns = 16

[eval.env.taskset]
id = "suppressed-features"
dataset_file = "suppressed-features.jsonl"
discovery_threshold = 0.8
heldout_threshold = 0.3
max_view_features = 4096
reward_mode = "eval"

[eval.env.harness]
id = "null"
