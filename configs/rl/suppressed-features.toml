# prime train run configs/rl/suppressed-features.toml
model = "Qwen/Qwen3.5-4B"
max_steps = 40
batch_size = 128
rollouts_per_example = 8

[sampling]
max_tokens = 16384
enable_thinking = false

[[pre_batch_filters]]
type = "zero_advantage"
enforce = true

[[post_batch_filters]]
type = "repetition"
enforce = false

[[env]]

[env.taskset]
id = "suppressed-features"
dataset_file = "suppressed-features-train.jsonl.gz"

[env.taskset.subject]
model_name = "Qwen/Qwen3-4B"
transcoder_set = "mwhanna/qwen3-4b-transcoders"
node_threshold = 0.8
edge_threshold = 0.98

[env.harness]
id = "circuit-null"

[eval]
interval = 10
num_examples = 16
rollouts_per_example = 1
eval_base_model = true

[[eval.env]]

[eval.env.taskset]
id = "suppressed-features"
dataset_file = "suppressed-features.jsonl.gz"

[eval.env.taskset.subject]
model_name = "Qwen/Qwen3-4B"
transcoder_set = "mwhanna/qwen3-4b-transcoders"
node_threshold = 0.8
edge_threshold = 0.98

[eval.env.harness]
id = "circuit-null"
