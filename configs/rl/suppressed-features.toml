# prime train run configs/rl/suppressed-features.toml
model = "Qwen/Qwen3.5-4B"
max_steps = 40
batch_size = 128
rollouts_per_example = 8

[sampling]
max_tokens = 16384
enable_thinking = false

[[pre_batch_filters]]
type = "zero_advantage"
enforce = true

[[post_batch_filters]]
type = "repetition"
enforce = false

[[env]]
max_turns = 16

[env.taskset]
id = "suppressed-features"
dataset_file = "suppressed-features-train.jsonl.gz"
min_heldout_success = 1.0
max_control_failure = 0.0

[env.harness]
id = "null"

[eval]
interval = 10
num_examples = 16
rollouts_per_example = 1
eval_base_model = true

[[eval.env]]
max_turns = 16

[eval.env.taskset]
id = "suppressed-features"
dataset_file = "suppressed-features.jsonl.gz"
min_heldout_success = 1.0
max_control_failure = 0.0

[eval.env.harness]
id = "null"
