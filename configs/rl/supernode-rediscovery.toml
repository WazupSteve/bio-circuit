# prime train run configs/rl/supernode-rediscovery.toml
model = "Qwen/Qwen3.5-4B"
max_steps = 40
batch_size = 128
rollouts_per_example = 8

[sampling]
max_tokens = 16384
enable_thinking = false

[[pre_batch_filters]]
type = "zero_advantage"
enforce = true

[[post_batch_filters]]
type = "repetition"
enforce = false

[[env]]
max_turns = 8

[env.taskset]
id = "supernode-rediscovery"
dataset_file = "rediscovery.jsonl"
prompt_budget = 5
max_features = 150
replacement_max_tv = 0.05
replacement_reward_half_life = 0.05

[env.harness]
id = "null"

[eval]
interval = 10
num_examples = 5
rollouts_per_example = 1
eval_base_model = true

[[eval.env]]
max_turns = 8

[eval.env.taskset]
id = "supernode-rediscovery"
dataset_file = "rediscovery.jsonl"
prompt_budget = 5
max_features = 150
replacement_max_tv = 0.05
replacement_reward_half_life = 0.05

[eval.env.harness]
id = "null"
