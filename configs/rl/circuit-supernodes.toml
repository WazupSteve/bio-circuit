# prime train run configs/rl/circuit-supernodes.toml
#
# Train on 6 prompt families, evaluate on held-out ones. Each rollout may spend
# its experiment budget on restoration trials. Final scoring compares the
# intervened response with the unmodified standard response.
model = "Qwen/Qwen3.5-4B"

max_steps = 40
batch_size = 128  # rollouts per step: 16 groups of 8
rollouts_per_example = 8

[sampling]
max_tokens = 16384
enable_thinking = false  # must match the eval config; never compare across modes

# Groups whose rollouts all score alike carry no gradient. Dropping them is the
# DAPO-style hygiene the plan called for, and the platform does it natively.
[[pre_batch_filters]]
type = "zero_advantage"
enforce = true

[[post_batch_filters]]
type = "repetition"
enforce = false

[[env]]
max_turns = 8

[env.taskset]
id = "circuit-supernodes"
dataset_file = "train.jsonl"
reward_mode = "train"

[env.harness]
id = "null"

[eval]
interval = 10
num_examples = 16
rollouts_per_example = 1
eval_base_model = true

[[eval.env]]
max_turns = 8

[eval.env.taskset]
id = "circuit-supernodes"
dataset_file = "heldout.jsonl"
reward_mode = "eval"

[eval.env.harness]
id = "null"
