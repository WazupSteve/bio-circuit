# prime rl run -c configs/rl/circuit-supernodes.toml
# Train on 6 prompt families, eval on 2 held-out ones (two_hop, addition).
# Each rollout may use three two-pass experiments before final scoring, which
# costs ~k+2 more GPU passes. Keep batches modest.
model = "Qwen/Qwen3.5-4B"

max_steps = 100
batch_size = 8
rollouts_per_example = 4

[sampling]
max_tokens = 16384
enable_thinking = false

[[env]]
max_turns = 4

[env.taskset]
id = "circuit-supernodes"
dataset_file = "train.jsonl"

[env.harness]
id = "null"

[eval]
interval = 25
num_examples = 8
rollouts_per_example = 1
eval_base_model = true

[[eval.env]]
max_turns = 4

[eval.env.taskset]
id = "circuit-supernodes"
dataset_file = "heldout.jsonl"

[eval.env.harness]
id = "null"
