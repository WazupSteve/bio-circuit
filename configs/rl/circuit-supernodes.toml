# prime train run configs/rl/circuit-supernodes.toml
#
# Each rollout asks the agent to design prompts for a separately deployed Gemma
# subject model, inspect circuit-tracer graphs, and recover a hidden supernode.
model = "Qwen/Qwen3.5-4B"

max_steps = 40
batch_size = 128  # rollouts per step: 16 groups of 8
rollouts_per_example = 8

[sampling]
max_tokens = 16384
enable_thinking = false  # must match the eval config; never compare across modes

# Groups whose rollouts all score alike carry no gradient. Dropping them is the
# DAPO-style hygiene the plan called for, and the platform does it natively.
[[pre_batch_filters]]
type = "zero_advantage"
enforce = true

[[post_batch_filters]]
type = "repetition"
enforce = false

[[env]]
max_turns = 8

[env.taskset]
id = "supernode-rediscovery"
dataset_file = "rediscovery.jsonl"
prompt_budget = 5
max_features = 150
replacement_max_tv = 0.05
replacement_reward_half_life = 0.05

[env.harness]
id = "null"

[eval]
interval = 10
num_examples = 5
rollouts_per_example = 1
eval_base_model = true

[[eval.env]]
max_turns = 8

[eval.env.taskset]
id = "supernode-rediscovery"
dataset_file = "rediscovery.jsonl"
prompt_budget = 5
max_features = 150
replacement_max_tv = 0.05
replacement_reward_half_life = 0.05

[eval.env.harness]
id = "null"
