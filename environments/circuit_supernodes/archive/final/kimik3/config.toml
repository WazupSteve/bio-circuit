max_turns = 8
model = "moonshotai/kimi-k3"
num_tasks = 20
num_rollouts = 2
shuffle = false
max_concurrent = 10
verbose = false
dry_run = false
rich = true
server = false
push = false

[taskset]
id = "circuit-supernodes"
dataset_file = "heldout.jsonl"
max_features = 150
experiment_budget = 7
reward_mode = "eval"
fault_rate = 0.0

[taskset.task]
judges = []

[harness]
id = "null"
forward_env = []

[harness.runtime]
type = "subprocess"

[harness.env]

[timeout]

[retries.rollout]
max_retries = 0
include = []
exclude = []

[interception]
type = "elastic"
multiplex = 32

[args]

[extra_env_kwargs]

[pool]
type = "elastic"
multiplex = 128

[client]
base_url = "https://api.pinference.ai/api/v1"
api_key_var = "PRIME_API_KEY"
type = "eval"

[client.headers]

[sampling]
reasoning_effort = "xhigh"
max_tokens = 32768
