[project]
name = "circuit-supernodes"
description = "Identify supernodes and circuits in Qwen3-4B attribution graphs built from per-layer transcoders"
tags = ["multi-turn", "interpretability", "train", "eval"]
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "verifiers==0.2.1",
    "modal>=1.5",
    "pydantic>=2.12.3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["circuit_supernodes/**", "pyproject.toml"]
