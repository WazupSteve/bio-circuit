[project]
name = "circuit-supernodes"
description = "Identify supernodes and circuits in Qwen3-4B attribution graphs built from cross-layer transcoders"
tags = ["single-turn", "interpretability", "train", "eval"]
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "verifiers>=0.1.14",
    "modal>=1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["circuit_supernodes/**", "pyproject.toml"]

[tool.verifiers.eval]
num_examples = 16
rollouts_per_example = 1
