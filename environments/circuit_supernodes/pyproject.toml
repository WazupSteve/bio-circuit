[project]
name = "circuit-supernodes"
description = "Independent causal-circuit, rediscovery, and restoration tasksets"
tags = ["multi-turn", "interpretability", "tool-use", "train", "eval"]
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "verifiers==0.2.1",
    "modal>=1.5",
    "pydantic>=2.12.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = [
    "circuit_supernodes/**",
    "output_restoration/**",
    "supernode_rediscovery/**",
    "scripts/**",
    "pyproject.toml",
]
