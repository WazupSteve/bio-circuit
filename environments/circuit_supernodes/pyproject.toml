[project]
name = "circuit-supernodes"
description = "Evidence/holdout causal-circuit, rediscovery, and restoration tasksets"
tags = ["multi-turn", "interpretability", "tool-use", "eval", "requires-gpu"]
version = "0.2.1"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "verifiers>=0.3.1,<0.4",
    "modal>=1.5",
    "pydantic>=2.12.3",
    "httpx>=0.28.1",
    "tenacity>=9.1.2",
    "typer>=0.27.0",
    "fastapi>=0.141.1",
    "huggingface-hub>=0.34,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = [
    "circuit_null/**",
    "circuit_supernodes/**",
    "supernode_rediscovery/**",
    "suppressed_features/**",
    "modal_app/**",
    "pyproject.toml",
    "README.md",
]
exclude = ["circuit_supernodes/data/**", "**/__pycache__/**"]

[tool.ty.src]
# Tests intentionally construct invalid Pydantic payloads, while modal_app is
# installed and checked in its separate GPU image with torch/circuit-tracer.
exclude = ["tests", "modal_app"]
