[project]
name = "circuit-supernodes"
description = "Evidence/holdout causal-circuit, rediscovery, and restoration tasksets"
tags = ["multi-turn", "interpretability", "tool-use", "train", "eval"]
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "verifiers==0.2.1",
    "modal>=1.5",
    "pydantic>=2.12.3",
    "httpx>=0.28.1",
    "tenacity>=9.1.2",
    "typer>=0.27.0",
    "fastapi>=0.141.1",
    "torch==2.13.0",
    "nnsight>=0.7.0",
    "circuit-tracer>=0.5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.15",
]

# Keep Linux GPU installs compatible with drivers supporting CUDA 12.8.
[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = [
    "circuit_null/**",
    "circuit_supernodes/**",
    "supernode_rediscovery/**",
    "suppressed_features/**",
    "pyproject.toml",
]

[tool.ty.src]
# Tests intentionally construct invalid Pydantic payloads, while modal_app is
# installed and checked in its separate GPU image with torch/circuit-tracer.
exclude = ["tests", "modal_app"]
