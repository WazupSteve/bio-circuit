[project]
name = "circuit-null"
version = "0.2.1"
description = "Bio-Circuit Verifiers v1 harness: the null harness with MCP 1.x, for hour-long circuit tool calls"
readme = "README.md"
requires-python = ">=3.11,<3.14"
tags = ["harness", "interpretability", "requires-gpu"]
dependencies = [
    "circuit-supernodes==0.2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["_biocircuit_circuit_null_release.py", "README.md", "pyproject.toml"]
